<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Stachbit - AI Lead Generator | Find Clients Who Need Websites</title>
  <meta name="title" content="Stachbit - AI Lead Generator | Find Clients Who Need Websites" />
  <meta name="description"
    content="Find businesses that need websites automatically. AI-powered lead generation, website analysis, contact extraction, and personalized email outreach for web developers and agencies." />
  <meta name="keywords"
    content="lead generation, business leads, website analysis, email outreach, client finder, web developer leads, agency leads, find clients, AI lead generation" />
  <meta name="author" content="Stachbit" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="English" />
  <meta name="revisit-after" content="7 days" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ai.stachbit.in/" />
  <meta property="og:title" content="Stachbit - AI Lead Generator | Find Clients Who Need Websites" />
  <meta property="og:description"
    content="Find businesses that need websites automatically. AI-powered lead generation for web developers and agencies." />
  <meta property="og:image" content="https://ai.stachbit.in/og-image.png" />
  <meta property="og:site_name" content="Stachbit" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://ai.stachbit.in/" />
  <meta property="twitter:title" content="Stachbit - AI Lead Generator | Find Clients Who Need Websites" />
  <meta property="twitter:description"
    content="Find businesses that need websites automatically. AI-powered lead generation for web developers and agencies." />
  <meta property="twitter:image" content="https://ai.stachbit.in/og-image.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://ai.stachbit.in/" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#6366f1" />
  <meta name="msapplication-TileColor" content="#6366f1" />

  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Stachbit",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered lead generation platform for web developers and agencies. Find businesses that need websites automatically.",
      "url": "https://ai.stachbit.in",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR",
        "description": "Free trial with 25 leads"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "500"
      }
    }
    </script>

  <!-- Structured Data - Website -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Stachbit",
      "url": "https://ai.stachbit.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ai.stachbit.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>

</body>

</html>
